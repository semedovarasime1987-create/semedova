bank.forEach((x,i)=>{let z=x.o.map((t,j)=>({t,ok:j===x.c}));let s=(i*5+1)%4;z=z.map((_,j)=>z[(j+s)%4]);x.o=z.map(v=>v.t);x.c=z.findIndex(v=>v.ok)});
let set=[],i=0,ans=[],timer,t=90,used=new Set();function pick(){let p=bank.filter(x=>!used.has(x.id));if(p.length<15){used.clear();p=[...bank]}p.sort(()=>Math.random()-.5);set=p.slice(0,15);set.forEach(x=>used.add(x.id))}function start(){pick();i=0;ans=Array(15).fill(null);document.getElementById('start').classList.add('hide');document.getElementById('result').classList.add('hide');document.getElementById('test').classList.remove('hide');render()}function render(){clearInterval(timer);t=90;tm.textContent=t;let x=set[i];pg.textContent=`Sual ${i+1} / 15 • Maddə ${x.a}`;bar.style.width=((i+1)/15*100)+'%';let h=`<div class="q">${x.q}</div>`;x.o.forEach((o,j)=>h+=`<button class="opt ${ans[i]===j?'sel':''}" onclick="choose(${j})"><b>${'ABCD'[j]}.</b> ${o}</button>`);box.innerHTML=h;back.disabled=i===0;next.textContent=i===14?'Nəticəni göstər':'Növbəti';timer=setInterval(()=>{t--;tm.textContent=t;if(t<=0){clearInterval(timer);nextQ()}},1000)}function choose(j){ans[i]=j;render()}function nextQ(){if(i<14){i++;render()}else finish()}function prev(){if(i>0){i--;render()}}function finish(){clearInterval(timer);let c=set.filter((x,j)=>ans[j]===x.c).length,u=ans.filter(x=>x===null).length;document.getElementById('test').classList.add('hide');document.getElementById('result').classList.remove('hide');score.textContent=`${c} / 15`;stat.textContent=`Düzgün: ${c} • Səhv: ${15-c-u} • Cavabsız: ${u}`;review.innerHTML='<h3>Cavab icmalı</h3>'+set.map((x,j)=>`<div><b>${j+1}. ${ans[j]===x.c?'<span class="good">Düzgün</span>':'<span class="bad">Səhv/cavabsız</span>'}</b><br>Düzgün cavab: ${'ABCD'[x.c]}. ${x.o[x.c]}</div>`).join('')}function restart(){start()}
</script></body></html>
