// Correct positions are deliberately redistributed at runtime while preserving exactly one correct option.
bank.forEach((x,i)=>{let opts=x.o.map((text,j)=>({text,correct:j===x.c}));let shift=(i*7+3)%4;opts=opts.map((v,j)=>opts[(j+shift)%4]);x.o=opts.map(v=>v.text);x.c=opts.findIndex(v=>v.correct);});
let current=[],idx=0,answers=[],timer=null,timeLeft=90,previousIds=new Set();
function pick15(){let pool=bank.filter(x=>!previousIds.has(x.id));if(pool.length<15){previousIds.clear();pool=[...bank];}pool.sort(()=>Math.random()-.5);current=pool.slice(0,15);current.forEach(x=>previousIds.add(x.id));}
function startTest(){pick15();idx=0;answers=Array(15).fill(null);document.getElementById('start').classList.add('hide');document.getElementById('result').classList.add('hide');document.getElementById('test').classList.remove('hide');render();}
function render(){clearInterval(timer);timeLeft=90;document.getElementById('timer').textContent=timeLeft;const x=current[idx];document.getElementById('progress').textContent=`Sual ${idx+1} / 15 • Maddə ${x.a}`;document.getElementById('bar').style.width=((idx+1)/15*100)+'%';let html=`<div class="q">${x.q}</div>`;x.o.forEach((o,i)=>html+=`<button class="opt ${answers[idx]===i?'sel':''}" onclick="choose(${i})"><b>${'ABCD'[i]}.</b>${o}</button>`);document.getElementById('question').innerHTML=html;document.getElementById('prev').disabled=idx===0;document.getElementById('next').textContent=idx===14?'Nəticəni göstər':'Növbəti';timer=setInterval(()=>{timeLeft--;document.getElementById('timer').textContent=timeLeft;if(timeLeft<=0){clearInterval(timer);nextQ();}},1000);}
function choose(i){answers[idx]=i;render();}
function nextQ(){if(idx<14){idx++;render();}else finish();}
function prevQ(){if(idx>0){idx--;render();}}
function finish(){clearInterval(timer);let correct=0;current.forEach((x,i)=>{if(answers[i]===x.c)correct++;});let unanswered=answers.filter(v=>v===null).length;document.getElementById('test').classList.add('hide');document.getElementById('result').classList.remove('hide');document.getElementById('score').textContent=`${correct} / 15`;document.getElementById('stats').textContent=`Düzgün: ${correct} • Səhv: ${15-correct-unanswered} • Cavabsız: ${unanswered}`;document.getElementById('review').innerHTML='<h3>Cavab icmalı</h3>'+current.map((x,i)=>{let ok=answers[i]===x.c;return `<div class="r"><strong>${i+1}. ${ok?'<span class="ok">Düzgün</span>':'<span class="bad">Səhv və ya cavabsız</span>'}</strong><div class="small">Düzgün cavab: ${'ABCD'[x.c]}. ${x.o[x.c]}</div></div>`}).join('');}
function restart(){startTest();}
</script></body></html>
